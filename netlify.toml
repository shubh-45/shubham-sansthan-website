# Netlify configuration for the Subham Sansthan website.
#
# There is no build step. The files in this repository ARE the website, so
# `publish` simply points at the repository root and no build command is set.
# Keeping this in the repo means the deploy settings are version-controlled
# rather than living only in the Netlify dashboard.

[build]
  publish = "."

# Sensible security headers. None of these need a server - Netlify applies
# them at the edge.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Deliberately NO Cache-Control override here.
#
# Netlify's default is exactly right for a site like this: it serves every
# file with an ETag and `max-age=0, must-revalidate`, while caching hard on
# its own CDN edge and purging that edge on every deploy. Visitors get CDN
# speed and still see an edit the moment it goes live.
#
# Do not add a long `max-age` for /assets/*. That trick only works when the
# build renames files as their contents change (style.a1b2c3.css). This site
# has no build step, so style.css keeps its name forever - and a long max-age
# would leave visitors stuck with an old stylesheet and an old logo until the
# cache expired, with no way for us to push a correction.
